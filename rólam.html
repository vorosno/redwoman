<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>rólam</title>
<style>
body {
    margin: 0;
    height: 100vh;
    background: #B32714;
    font-family: Futura, sans-serif;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
}

a.back {
    position: absolute;
    top: 30px;
    left: 30px;
    color: white;
    text-decoration: none;
    font-size: 18px;
}

h1 {
    font-size: 60px;
    margin-bottom: 20px;
}

p {
    font-size: 20px;
    max-width: 600px;
    text-align: center;
    margin-bottom: 40px;
}

/* Legfelül középen a két szem GIF */
#top-gif {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: auto;
    z-index: 5;
}

/* GIF konténer */
.gif-container {
    display: flex;
    gap: 35px; /* távolság a GIF-ek között */
}

.gif-container a img {
    width: 250px;  /* tetszőleges méret */
    height: auto;
    cursor: pointer;
    transition: transform 0.3s;
}

.gif-container a img:hover {
    transform: scale(1.1); /* kicsi nagyítás hover-re */
}
</style>
</head>
<body>

<a href="index.html" class="back">vissza</a>

<!-- Legfelül a két szem GIF -->
<img src="ketszem.gif" alt="Két szem" id="top-gif">

<h1>rólam</h1>
<p>itt majd olvass.</p>

<!-- Három kattintható GIF egymás mellett -->
<div class="gif-container">
    <a href="oldal1.html"><img src="gif1.gif" alt="Gif 1"></a>
    <a href="oldal2.html"><img src="gif2.gif" alt="Gif 2"></a>
    <a href="oldal3.html"><img src="gif3.gif" alt="Gif 3"></a>
</div>

</body>
</html>
