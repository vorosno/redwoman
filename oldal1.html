<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>Tic-Tac-Toe</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
<style>
body {
    margin: 0;
    height: 100vh;
    background-color: #D43B19;
    font-family: Futura, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
}

a.back {
    position: absolute;
    top: 20px;
    left: 20px;
    color: white;
    text-decoration: none;
    font-size: 18px;
}

button#reset-btn {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 18px;
    background: transparent;
    color: white;
    border: 2px solid white;
    cursor: pointer;
}

button#reset-btn:hover {
    background: white;
    color: #D43B19; 
}

#winnerGif {
    display: none;
    width: 500px;
    height: 500px;
    margin-top: 20px;
}

#resultText {
    color: white;
    font-size: 28px;
    margin-top: 10px;
    min-height: 34px;
    text-align: center;
}
</style>
</head>
<body>

<a href="rólam.html" class="back">vissza</a>

<h1 style="color:white;">Tic-Tac-Toe</h1>
<p style="color:white;">Játssz az X-el, a gép O-val!</p>

<button id="reset-btn">Új játék</button>
<div id="resultText"></div>

<img id="winnerGif" src="" alt="Nyertes">

<script>
let board;
let w, h;
let currentPlayer = 'X';
let gameOver = false;
let winner = null;
let canvas;

function setup() {
  canvas = createCanvas(450, 450);
  canvas.parent(document.body);
  canvas.style('margin-top','20px');
  w = width / 3;
  h = height / 3;
  initBoard();
  textSize(96);
  textAlign(CENTER, CENTER);
}

function draw() {
  clear();

  stroke(255);
  strokeWeight(6);
  line(w, 0, w, height);
  line(2*w, 0, 2*w, height);
  line(0, h, width, h);
  line(0, 2*h, width, 2*h);

  fill(255);
  noStroke();
  for(let i=0;i<3;i++){
    for(let j=0;j<3;j++){
      let xPos = w*j + w/2;
      let yPos = h*i + h/2;
      text(board[i][j], xPos, yPos);
    }
  }
}

function mousePressed(){
  if(gameOver) return;
  let j = floor(mouseX / w);
  let i = floor(mouseY / h);
  if(i>=0 && i<3 && j>=0 && j<3 && board[i][j]==''){
    board[i][j] = 'X';
    if(checkWinner('X')){
      winner = 'X';
      gameOver = true;
      showWinner();
    } else if(isBoardFull()){
      winner = null;
      gameOver = true;
      showResult("Döntetlen!");
    } else {
      setTimeout(aiMove, 500); // AI késleltetés
    }
  }
}

function aiMove(){
  if(gameOver) return;
  let emptyCells = [];
  for(let i=0;i<3;i++){
    for(let j=0;j<3;j++){
      if(board[i][j]=='') emptyCells.push([i,j]);
    }
  }
  if(emptyCells.length > 0){
    let choice = random(emptyCells);
    board[choice[0]][choice[1]] = 'O';
    if(checkWinner('O')){
      winner = 'O';
      gameOver = true;
      showWinner();
    } else if(isBoardFull()){
      winner = null;
      gameOver = true;
      showResult("Döntetlen!");
    }
  }
}

function checkWinner(player){
  for(let i=0;i<3;i++){
    if(board[i][0]===player && board[i][1]===player && board[i][2]===player) return true;
    if(board[0][i]===player && board[1][i]===player && board[2][i]===player) return true;
  }
  if(board[0][0]===player && board[1][1]===player && board[2][2]===player) return true;
  if(board[0][2]===player && board[1][1]===player && board[2][0]===player) return true;
  return false;
}

function isBoardFull(){
  for(let i=0;i<3;i++){
    for(let j=0;j<3;j++){
      if(board[i][j]=='') return false;
    }
  }
  return true;
}

function initBoard(){
  board = [
    ['','',''],
    ['','',''],
    ['','','']
  ];
  currentPlayer = 'X';
  gameOver = false;
  winner = null;
  loop();
  document.getElementById('winnerGif').style.display = 'none';
  document.getElementById('winnerGif').src = '';
  document.getElementById('resultText').innerText = "";
}

function showWinner(){
  if(winner === 'X'){
    document.getElementById('winnerGif').src = 'csotany.gif';
    document.getElementById('resultText').innerText = "Te nyertél!";
  } else if(winner === 'O'){
    document.getElementById('winnerGif').src = 'csiga.gif';
    document.getElementById('resultText').innerText = "A gép nyert!";
  }
  document.getElementById('winnerGif').style.display = 'block';
  noLoop();
}

function showResult(text){
  document.getElementById('resultText').innerText = text;
  document.getElementById('winnerGif').style.display = 'none';
  noLoop();
}

document.getElementById('reset-btn').addEventListener('click', initBoard);
</script>

</body>
</html>
