<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>helloo</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: #B32714;
    font-family: "Futura PT", "Futura", sans-serif;
    font-weight: 300;
    color: white;
    overflow-x: hidden;
}

/* ================= ERŐS GRAIN ================= */

.grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    opacity: 0.35;
    background-image:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='1.2' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    mix-blend-mode: overlay;
}

/* ================= TOP MENÜ ================= */

.topbar {
    position: fixed;
    top: 0;
    width: 100%;
    height: 90px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.menu-wrapper {
    position: relative;
    padding: 30px;
}

.menu-icon {
    display: flex;
    flex-direction: column;
    gap: 8px;
    cursor: pointer;
}

.menu-icon span {
    width: 34px;
    height: 1.5px;
    background: white;
}

/* Fade dropdown */

.menu-dropdown {
    position: absolute;
    top: 70px;
    left: 50%;
    transform: translateX(-50%) translateY(-10px);
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s ease;
}

.menu-wrapper:hover .menu-dropdown {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
}

.menu-dropdown a {
    text-decoration: none;
    color: white;
    margin: 10px 0;
    letter-spacing: 3px;
    font-weight: 300;
}

/* ================= MOZGÓ BETŰK ================= */

.letter-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
}

.letter-line {
    position: absolute;
    white-space: nowrap;
    font-size: 18px;
    opacity: 0.08;
    animation: moveLeft linear infinite;
}

@keyframes moveLeft {
    from { transform: translateX(100%); }
    to { transform: translateX(-100%); }
}

/* ================= SLIDER ================= */

.slider {
    position: absolute;
    top: 150px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
    z-index: 2;
}

.slider img {
    width: 200px;
    height: 130px;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.4s ease;
}

.slider img.active {
    opacity: 1;
}

/* ================= CÍM ================= */

.big-title {
    position: absolute;
    bottom: 40px;
    left: 40px;
    font-size: 90px;
    letter-spacing: 3px;
    z-index: 2;
    font-weight: 300;
}

/* ================= FÜLEK ================= */

.item {
    position: absolute;
    font-size: 28px;
    cursor: pointer;
    text-decoration: none;
    color: white;
    z-index: 2;
    font-weight: 300;
    letter-spacing: 2px;
    transition: opacity 0.3s ease;
}

.item:hover {
    opacity: 0.5;
}

/* ================= PROJEKTEK LENYÍLÓ ================= */

.projects-wrapper {
    position: absolute;
    z-index: 2;
}

.projects-dropdown {
    position: absolute;
    top: 45px;
    left: 0;
    display: flex;
    flex-direction: column;
    opacity: 0;
    pointer-events: none;
    transform: translateY(-10px);
    transition: opacity 0.35s ease, transform 0.35s ease;
}

.projects-wrapper:hover .projects-dropdown {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
}

.projects-dropdown a {
    text-decoration: none;
    color: white;
    margin: 8px 0;
    font-size: 16px;
    letter-spacing: 2px;
    font-weight: 300;
}
</style>
</head>

<body>

<div class="grain"></div>
<div class="letter-layer" id="letterLayer"></div>

<!-- ================= TOP MENÜ ================= -->

<div class="topbar">
    <div class="menu-wrapper">
        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="menu-dropdown">
            <a href="#">valami 1</a>
            <a href="#">valami 2</a>
            <a href="#">valami 3</a>
        </div>
    </div>
</div>

<!-- ================= SLIDER ================= -->

<div class="slider">
    <img src="barany1.JPG">
    <img src="barany2.JPG">
    <img src="barany3.JPG">
    <img src="barany4.JPG">
</div>

<h1 class="big-title">én vagyok</h1>

<a href="rólam.html" class="item" style="top:50%; left:20%;">rólam</a>

<div class="projects-wrapper" style="top:60%; left:50%;">
    <div class="item">projektek</div>
    <div class="projects-dropdown">
        <a href="videok.html">Videók</a>
        <a href="kepek.html">Képek</a>
        <a href="mindenfelek.html">Mindenfélék</a>
    </div>
</div>

<a href="kapcsolat.html" class="item" style="top:70%; left:75%;">kapcsolat</a>

<script>
/* SLIDER */
const slides = document.querySelectorAll(".slider img");
let current = 0;
slides[current].classList.add("active");

setInterval(() => {
    slides[current].classList.remove("active");
    current = (current + 1) % slides.length;
    slides[current].classList.add("active");
}, 2000);

/* MOZGÓ BETŰK */
const layer = document.getElementById("letterLayer");
const abc = "abcdefghijklmnopqrstuvwxyz";
const words = ["szerelem","idő","mindenkinek","álom","ember","csend","fény","tér","haladás","érték"];

function generateLine() {
    let text = "";
    for (let i = 0; i < 180; i++) {
        if (Math.random() < 0.02) {
            text += " " + words[Math.floor(Math.random()*words.length)] + " ";
        } else {
            text += abc[Math.floor(Math.random()*abc.length)];
        }
    }
    return text;
}

for (let i = 0; i < 30; i++) {
    const line = document.createElement("div");
    line.className = "letter-line";
    line.style.top = (i * 30) + "px";
    line.style.animationDuration = (20 + Math.random()*20) + "s";
    line.textContent = generateLine();
    layer.appendChild(line);
}
</script>

</body>
</html>
