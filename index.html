<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>helloo</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>

<style>
body {
    margin: 0;
    height: 100vh;
    background-color: #B32714;
    background-image: url('kep2.jpeg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    font-family: Futura, sans-serif;
    color: white;
}

/* ================= TOP BAR ================= */

.topbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 45px;
    background: white;
    color: black;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 25px;
    font-size: 13px;
    letter-spacing: 2px;
    z-index: 9999;
}

.topbar a {
    color: black;
    text-decoration: none;
    margin-right: 20px;
}

.hamburger {
    display: flex;
    flex-direction: column;
    gap: 4px;
    cursor: pointer;
}

.hamburger span {
    width: 20px;
    height: 2px;
    background: black;
}

.hamburger-menu {
    position: fixed;
    top: 45px;
    right: 0;
    background: white;
    display: none;
    flex-direction: column;
    padding: 15px 25px;
    z-index: 9999;
}

.hamburger-menu a {
    color: black;
    text-decoration: none;
    margin: 6px 0;
}

/* ================= MOZGÓ BETŰK ================= */

.letter-layer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
}

.letter-line {
    position: absolute;
    white-space: nowrap;
    font-size: 18px;
    opacity: 0.12;
    animation: moveLeft linear infinite;
}

@keyframes moveLeft {
    from { transform: translateX(100%); }
    to { transform: translateX(-100%); }
}

/* ================= EREDETI STÍLUSOK ================= */

.slider {
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
    z-index: 2;
}

.slider img {
    width: 200px;
    height: 130px;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.3s ease-in-out;
}

.slider img.active {
    opacity: 1;
}

.big-title {
    position: absolute;
    bottom: 40px;
    left: 40px;
    font-size: 90px;
    letter-spacing: 3px;
    user-select: none;
    z-index: 2;
}

.item {
    position: absolute;
    font-size: 28px;
    cursor: grab;
    user-select: none;
    text-decoration: none;
    color: white;
    z-index: 2;
}

.item:active {
    cursor: grabbing;
}

.item:hover {
    opacity: 0.7;
}

.dropdown-content {
    position: absolute;
    background-color: rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    padding: 10px 0;
    border-radius: 6px;
    min-width: 150px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease, transform 0.4s ease;
    z-index: 10;
}

.dropdown-content a {
    color: white;
    text-decoration: none;
    padding: 5px 20px;
}

.dropdown-content a:hover {
    background-color: rgba(255,255,255,0.15);
    border-radius: 4px;
}
</style>
</head>

<body>

<!-- ================= TOP BAR ================= -->

<div class="topbar">
    <div>
        <a href="#">Link1</a>
        <a href="#">Link2</a>
        <a href="#">Link3</a>
    </div>

    <div class="hamburger" id="hamburger">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<div class="hamburger-menu" id="hamburgerMenu">
    <a href="#">1</a>
    <a href="#">2</a>
    <a href="#">3</a>
    <a href="#">4</a>
</div>

<!-- ================= MOZGÓ BETŰ HÁTTÉR ================= -->

<div class="letter-layer" id="letterLayer"></div>

<!-- ================= EREDETI TARTALOM ================= -->

<div class="slider">
    <img src="barany1.JPG">
    <img src="barany2.JPG">
    <img src="barany3.JPG">
    <img src="barany4.JPG">
</div>

<h1 class="big-title">én vagyok</h1>

<a href="rólam.html" class="item" style="top:40%; left:30%;">rólam</a>

<a href="#" class="item dropdown" style="top:50%; left:50%;">projektek</a>

<div class="dropdown-content" id="projects-dropdown">
    <a href="videok.html">Videók</a>
    <a href="kepek.html">Képek</a>
    <a href="mindenfelek.html">Mindenfélék</a>
</div>

<a href="kapcsolat.html" class="item" style="top:60%; left:70%;">kapcsolat</a>

<!-- ================= JAVASCRIPT ================= -->

<script>
// HAMBURGER
const hamburger = document.getElementById("hamburger");
const hamburgerMenu = document.getElementById("hamburgerMenu");

hamburger.addEventListener("click", () => {
    hamburgerMenu.style.display =
        hamburgerMenu.style.display === "flex" ? "none" : "flex";
});

// BETŰ HÁTTÉR
const layer = document.getElementById("letterLayer");
const abc = "abcdefghijklmnopqrstuvwxyz";
const words = ["szerelem","idő","város","álom","ember","csend","fény","tér"];

function generateLine() {
    let text = "";
    for (let i = 0; i < 150; i++) {
        if (Math.random() < 0.015) {
            text += " " + words[Math.floor(Math.random()*words.length)] + " ";
        } else {
            text += abc[Math.floor(Math.random()*abc.length)];
        }
    }
    return text;
}

for (let i = 0; i < 20; i++) {
    const line = document.createElement("div");
    line.className = "letter-line";
    line.style.top = (i * 40) + "px";
    line.style.animationDuration = (25 + Math.random()*20) + "s";
    line.textContent = generateLine();
    layer.appendChild(line);
}
</script>

</body>
</html>
