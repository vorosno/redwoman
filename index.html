<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>helloo</title>

<!-- p5.js könyvtár -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: #B32714;
        font-family: Futura, sans-serif;
        overflow: hidden;
        position: relative;
    }

    /* SLIDER - egy sorban */
    .slider {
        position: absolute;
        top: 40px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 20px;
    }

    .slider img {
        width: 200px;
        height: 130px;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.3s ease-in-out;
    }

    .slider img.active {
        opacity: 1;
    }

    /* Nagy fix felirat bal alul */
    .big-title {
        position: absolute;
        bottom: 40px;
        left: 40px;
        font-size: 90px;
        color: white;
        letter-spacing: 3px;
        user-select: none;
    }

    .item {
        position: absolute;
        font-size: 28px;
        color: white;
        cursor: grab;
        user-select: none;
        text-decoration: none;
    }

    .item:active {
        cursor: grabbing;
    }

    .item:hover {
        opacity: 0.7;
    }

    /* LEGÖRDÜLŐ PANEL - CSILLAGSZERŰ/AMORF */
    .dropdown-content {
        position: absolute;
        background-color: rgba(0,0,0,0.2); /* 20% opacity */
        color: white;
        font-family: Futura, sans-serif;
        display: flex;
        flex-direction: column;
        padding: 20px;
        min-width: 180px;
        opacity: 0; /* kezdő láthatóság */
        pointer-events: none;
        transition: opacity 0.4s ease, transform 0.4s ease;
        z-index: 10;

        /* CSILLAGSZERŰ ALAK */
        clip-path: polygon(
            50% 0%, 61% 35%, 98% 35%, 
            68% 57%, 79% 91%, 50% 70%, 
            21% 91%, 32% 57%, 2% 35%, 
            39% 35%
        );
        text-align: center;
    }

    .dropdown-content a {
        color: white;
        text-decoration: none;
        padding: 5px 10px;
        margin: 5px 0;
    }

    .dropdown-content a:hover {
        background-color: rgba(255,255,255,0.15);
        border-radius: 4px;
    }
</style>
</head>
<body>

<!-- KÉPEK -->
<div class="slider">
    <img src="barany1.JPG">
    <img src="barany2.JPG">
    <img src="barany3.JPG">
    <img src="barany4.JPG">
</div>

<h1 class="big-title">én vagyok</h1>

<a href="rólam.html" class="item" style="top:40%; left:30%;">rólam</a>

<!-- Projektek menü és csillagszerű legördülő -->
<a href="#" class="item dropdown" style="top:50%; left:50%;">projektek</a>
<div class="dropdown-content" id="projects-dropdown">
    <a href="videok.html">Videók</a>
    <a href="kepek.html">Képek</a>
    <a href="mindenfelek.html">Mindenfélék</a>
</div>

<a href="kapcsolat.html" class="item" style="top:60%; left:70%;">kapcsolat</a>

<!-- SLIDER és menüpontok logika -->
<script>
    // SLIDER LOGIKA
    const slides = document.querySelectorAll(".slider img");
    let current = 0;
    slides[current].classList.add("active");

    setInterval(() => {
        slides[current].classList.remove("active");
        current = (current + 1) % slides.length;
        slides[current].classList.add("active");
    }, 2000);

    // HÚZHATÓ MENÜPONTOK
    const items = document.querySelectorAll(".item");

    items.forEach(item => {
        let offsetX, offsetY, isDragging = false;

        item.addEventListener("mousedown", (e) => {
            isDragging = true;
            offsetX = e.clientX - item.offsetLeft;
            offsetY = e.clientY - item.offsetTop;
        });

        document.addEventListener("mousemove", (e) => {
            if (isDragging) {
                item.style.left = (e.clientX - offsetX) + "px";
                item.style.top = (e.clientY - offsetY) + "px";
            }
        });

        document.addEventListener("mouseup", () => {
            isDragging = false;
        });
    });

    // CSILLAGSZERŰ LEGÖRDÜLŐ PANEL ANIMÁCIÓ
    const projectsItem = document.querySelector(".dropdown");
    const dropdown = document.getElementById("projects-dropdown");

    function updateDropdownPosition() {
        const rect = projectsItem.getBoundingClientRect();
        dropdown.style.top = rect.bottom + "px";
        dropdown.style.left = rect.left + "px";
    }
    updateDropdownPosition();
    window.addEventListener("resize", updateDropdownPosition);

    projectsItem.addEventListener("mouseenter", () => {
        updateDropdownPosition();
        dropdown.style.opacity = "1";
        dropdown.style.transform = "translateY(0px) scale(1)";
        dropdown.style.pointerEvents = "auto";
    });

    projectsItem.addEventListener("mouseleave", () => {
        dropdown.style.opacity = "0";
        dropdown.style.transform = "translateY(-10px) scale(0.9)";
        dropdown.style.pointerEvents = "none";
    });

    dropdown.addEventListener("mouseenter", () => {
        dropdown.style.opacity = "1";
        dropdown.style.transform = "translateY(0px) scale(1)";
        dropdown.style.pointerEvents = "auto";
    });
    dropdown.addEventListener("mouseleave", () => {
        dropdown.style.opacity = "0";
        dropdown.style.transform = "translateY(-10px) scale(0.9)";
        dropdown.style.pointerEvents = "none";
    });
</script>

<!-- PORSZERŰ EGÉRKÖVETŐ EFFEKT p5.js -->
<script>
let particles = [];

function setup() {
  let canvas = createCanvas(window.innerWidth, window.innerHeight);
  canvas.position(0, 0);
  canvas.style('z-index', '-1');
  canvas.style('pointer-events', 'none');
  background(179, 39, 20);
  smooth();
}

function draw() {
  fill(179, 39, 20, 15);
  noStroke();
  rect(0, 0, width, height);

  if (mouseX != pmouseX || mouseY != pmouseY) {
    for (let i = 0; i < 12; i++) {
      particles.push({
        x: mouseX + random(-5,5),
        y: mouseY + random(-5,5),
        size: random(1, 2.5),
        alpha: random(150, 255),
        vx: random(-0.3,0.3),
        vy: random(-0.3,0.3)
      });
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= 1.5;
    fill(255, p.alpha);
    noStroke();
    ellipse(p.x, p.y, p.size);

    if (p.alpha <= 0) {
      particles.splice(i, 1);
    }
  }
}

function windowResized() {
  resizeCanvas(window.innerWidth, window.innerHeight);
}
</script>

</body>
</html>
