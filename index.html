<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>helloo</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>

<style>
body {
    margin: 0;
    height: 100vh;
    background-color: #B32714;
    font-family: Futura, sans-serif;
    color: white;
    overflow-x: hidden;
}

/* ===== GRAIN RÉTEG ===== */
.grain {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.15;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
}

/* ===== ÁTLÁTSZÓ TOP ===== */
.topbar {
    position: fixed;
    top: 0;
    width: 100%;
    height: 70px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

/* ===== KÖZÉPSŐ MENÜ IKON ===== */
.menu-wrapper {
    position: relative;
}

.menu-icon {
    display: flex;
    flex-direction: column;
    gap: 6px;
    cursor: pointer;
}

.menu-icon span {
    width: 28px;
    height: 2px;
    background: white;
}

/* ===== LENYÍLÓ MENÜ ===== */
.menu-dropdown {
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    flex-direction: column;
    text-align: center;
}

.menu-dropdown a {
    text-decoration: none;
    color: white;
    margin: 6px 0;
    font-size: 14px;
    letter-spacing: 2px;
}

.menu-wrapper:hover .menu-dropdown {
    display: flex;
}

/* ===== SLIDER ===== */
.slider {
    position: absolute;
    top: 120px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
    z-index: 2;
}

.slider img {
    width: 200px;
    height: 130px;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.3s ease-in-out;
}

.slider img.active {
    opacity: 1;
}

/* ===== CÍM ===== */
.big-title {
    position: absolute;
    bottom: 40px;
    left: 40px;
    font-size: 90px;
    letter-spacing: 3px;
    user-select: none;
    z-index: 2;
}

/* ===== MOZGÓ BETŰK ===== */
.letter-layer {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
}

.letter-line {
    position: absolute;
    white-space: nowrap;
    font-size: 18px;
    opacity: 0.08;
    animation: moveLeft linear infinite;
}

@keyframes moveLeft {
    from { transform: translateX(100%); }
    to { transform: translateX(-100%); }
}
</style>
</head>

<body>

<div class="grain"></div>
<div class="letter-layer" id="letterLayer"></div>

<!-- ===== TOP MENÜ ===== -->
<div class="topbar">
    <div class="menu-wrapper">
        <div class="menu-icon">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="menu-dropdown">
            <a href="#">valami 1</a>
            <a href="#">valami 2</a>
            <a href="#">valami 3</a>
        </div>
    </div>
</div>

<!-- ===== SLIDER ===== -->
<div class="slider">
    <img src="barany1.JPG">
    <img src="barany2.JPG">
    <img src="barany3.JPG">
    <img src="barany4.JPG">
</div>

<h1 class="big-title">én vagyok</h1>

<script>
// ===== SLIDER =====
const slides = document.querySelectorAll(".slider img");
let current = 0;
slides[current].classList.add("active");

setInterval(() => {
    slides[current].classList.remove("active");
    current = (current + 1) % slides.length;
    slides[current].classList.add("active");
}, 2000);

// ===== MOZGÓ BETŰK =====
const layer = document.getElementById("letterLayer");
const abc = "abcdefghijklmnopqrstuvwxyz";
const words = ["szerelem","idő","város","álom","ember","csend","fény","tér","kutya","ház"];

function generateLine() {
    let text = "";
    for (let i = 0; i < 160; i++) {
        if (Math.random() < 0.015) {
            text += " " + words[Math.floor(Math.random()*words.length)] + " ";
        } else {
            text += abc[Math.floor(Math.random()*abc.length)];
        }
    }
    return text;
}

for (let i = 0; i < 25; i++) {
    const line = document.createElement("div");
    line.className = "letter-line";
    line.style.top = (i * 35) + "px";
    line.style.animationDuration = (25 + Math.random()*20) + "s";
    line.textContent = generateLine();
    layer.appendChild(line);
}
</script>

</body>
</html>
