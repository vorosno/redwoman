<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>helloo</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: #B32714;
        font-family: Futura, sans-serif;
        overflow: hidden;
        position: relative;
    }

    /* SLIDER - egy sorban */
    .slider {
        position: absolute;
        top: 40px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 20px;
    }

    .slider img {
        width: 200px;
        height: 130px;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.3s ease-in-out;
    }

    .slider img.active {
        opacity: 1;
    }

    /* Nagy fix felirat bal alul */
    .big-title {
        position: absolute;
        bottom: 40px;
        left: 40px;
        font-size: 90px;
        color: white;
        letter-spacing: 3px;
        user-select: none;
    }

    .item {
        position: absolute;
        font-size: 28px;
        color: white;
        cursor: grab;
        user-select: none;
        text-decoration: none;
    }

    .item:active {
        cursor: grabbing;
    }

    .item:hover {
        opacity: 0.7;
    }
</style>
</head>
<body>

<!-- KÉPEK (nincs mappa, nagybetűs .JPG) -->
<div class="slider">
    <img src="barany1.JPG">
    <img src="barany2.JPG">
    <img src="barany3.JPG">
    <img src="barany4.JPG">
</div>

<h1 class="big-title">én vagyok</h1>

<a href="rólam.html" class="item" style="top:40%; left:30%;">rólam</a>
<a href="projektek.html" class="item" style="top:50%; left:50%;">projektek</a>
<a href="kapcsolat.html" class="item" style="top:60%; left:70%;">kapcsolat</a>

<script>
    // SLIDER LOGIKA - balról jobbra, 1 látható
    const slides = document.querySelectorAll(".slider img");
    let current = 0;

    // első kép induláskor látszódjon
    slides[current].classList.add("active");

    setInterval(() => {
        slides[current].classList.remove("active");
        current = (current + 1) % slides.length;
        slides[current].classList.add("active");
    }, 2000);


    // HÚZHATÓ MENÜPONTOK
    const items = document.querySelectorAll(".item");

    items.forEach(item => {
        let offsetX, offsetY, isDragging = false;

        item.addEventListener("mousedown", (e) => {
            isDragging = true;
            offsetX = e.clientX - item.offsetLeft;
            offsetY = e.clientY - item.offsetTop;
        });

        document.addEventListener("mousemove", (e) => {
            if (isDragging) {
                item.style.left = (e.clientX - offsetX) + "px";
                item.style.top = (e.clientY - offsetY) + "px";
            }
        });

        document.addEventListener("mouseup", () => {
            isDragging = false;
        });
    });
</script>

</body>
</html>
