<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>valami</title>

<style>
body {
    margin: 0;
    background: #B32714;
    font-family: Futura, Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

.back-button {
    position: absolute;
    top: 20px;
    left: 20px;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    z-index: 10;
}

.main-image {
    max-width: 95vw;
    max-height: 95vh;
    object-fit: contain;
}
</style>
</head>

<body>

<div class="back-button" onclick="history.back()">VISSZA</div>

<img src="lena1.JPG" id="slideshow" class="main-image">

<script>
const images = ["lena1.JPG", "lena2.JPG"];
let index = 0;

const img = document.getElementById("slideshow");

setInterval(() => {
    index = (index + 1) % images.length;
    img.src = images[index] + "?t=" + new Date().getTime();
}, 5000);
</script>

</body>
</html>
