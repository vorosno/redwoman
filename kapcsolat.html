<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>instám, youtubeom</title>

<style>
body {
  margin: 0;
  background: #d00000;
  font-family: Futura, Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

/* 🔙 Vissza gomb */
.back-button {
  position: absolute;
  left: 20px;
  top: 20px;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  user-select: none;
}

/* Középső ikonok */
.icons {
  display: flex;
  align-items: center;
  gap: 60px;
}

/* ⭐ Csillag */
.star {
  font-size: 140px;
  color: white;
  text-decoration: none;
  user-select: none;
  animation: spinFloat1 3s linear infinite;
}

/* ▶ Háromszög */
.triangle {
  font-size: 140px;
  color: white;
  text-decoration: none;
  user-select: none;
  animation: spinFloat2 2.5s linear infinite;
}

/* ⭐ Animáció */
@keyframes spinFloat1 {
  0% {
    transform: rotate(0deg) translateX(0px);
  }
  25% {
    transform: rotate(90deg) translateX(15px);
  }
  50% {
    transform: rotate(180deg) translateX(0px);
  }
  75% {
    transform: rotate(270deg) translateX(-15px);
  }
  100% {
    transform: rotate(360deg) translateX(0px);
  }
}

/* ▶ Animáció */
@keyframes spinFloat2 {
  0% {
    transform: rotate(0deg) translateX(0px);
  }
  25% {
    transform: rotate(-90deg) translateX(-20px);
  }
  50% {
    transform: rotate(-180deg) translateX(0px);
  }
  75% {
    transform: rotate(-270deg) translateX(20px);
  }
  100% {
    transform: rotate(-360deg) translateX(0px);
  }
}
</style>
</head>

<body>

<!-- 🔙 Vissza -->
<div class="back-button" onclick="history.back()">VISSZA</div>

<div class="icons">

  <!-- ⭐ Instagram -->
  <a 
    class="star" 
    href="https://www.instagram.com/kikivivki/" 
    target="_blank"
  >
    ★
  </a>

  <!-- ▶ YouTube -->
  <a 
    class="triangle" 
    href="https://www.youtube.com/@kivijarski" 
    target="_blank"
  >
    ▶
  </a>

</div>

</body>
</html>
