<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>oldal2</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: #D43B19; /* piros */
    font-family: Futura, sans-serif;
}

.word {
    position: absolute;
    white-space: nowrap;
    color: white;
    user-select: none;
    pointer-events: none;
}
</style>
</head>
<body>

<script>

const sentence = "nem tudok mit mondani se magamról, se semmi másról senkinek. nem feladatom magyarázni, sem neked, sem magamnak ... nem kenyerem nem kenyerem nem kenyerem és nem feladatom, hogy megérts";

const words = sentence.split(" ");

function generateChaos() {

    document.body.innerHTML = "";

    const screenWidth = window.innerWidth;
    const screenHeight = window.innerHeight;

    const amount = 800; // sok elem, hogy teljesen betakarja

    for (let i = 0; i < amount; i++) {

        const word = document.createElement("div");
        word.classList.add("word");

        word.innerText = words[Math.floor(Math.random() * words.length)];

        // nagyon eltérő méretek
        const fontSize = Math.random() * 180 + 10; // 10px - 190px
        word.style.fontSize = fontSize + "px";

        word.style.left = Math.random() * screenWidth + "px";
        word.style.top = Math.random() * screenHeight + "px";

        document.body.appendChild(word);
    }
}

generateChaos();
window.addEventListener("resize", generateChaos);

</script>

</body>
</html>
