<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV torony</title>

<style>
body {
  margin: 0;
  background: #d00000;
  color: white;
  font-family: Futura, Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
}

h1 {
  position: absolute;
  top: 20px;
  font-size: 24px;
  text-align: center;
}

/* 🔙 Vissza gomb */
.back-button {
  position: absolute;
  left: 20px;
  top: 20px;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  user-select: none;
}

.needle {
  position: absolute;
  width: 288px;
  height: auto;
  bottom: 50%;
  left: 50%;
  transform-origin: 50% 100%;
  transform: translateX(-50%) rotate(0deg);
  transition: transform 0.1s linear;
}

.info {
  position: absolute;
  bottom: 20px;
  text-align: center;
  font-size: 16px;
  font-weight: bold;
}

button {
  position: absolute;
  bottom: 70px;
  padding: 12px 24px;
  background: white;
  color: #d00000;
  border: none;
  font-weight: bold;
  border-radius: 6px;
}
</style>
</head>

<body>

<!-- 🔙 Vissza -->
<div class="back-button" onclick="history.back()">VISSZA</div>

<h1>TV TORONY</h1>

<!-- Csak a torony tűje, középre igazítva -->
<img src="torony.png" class="needle" id="needle">

<!-- Információs szöveg: távolság -->
<div class="info" id="info">Nyomd meg az indítást</div>

<!-- Indító gomb -->
<button id="startButton" onclick="start()">Indítás</button>

<script>
const needle = document.getElementById("needle");
const info = document.getElementById("info");
const startButton = document.getElementById("startButton");

// 🎯 cél: Pécsi TV torony
const targetLat = 46.099167;
const targetLon = 18.220306;

let userLat = null;
let userLon = null;
let heading = null;

function start() {
  info.innerHTML = "Engedélyek kérése...";

  // 📡 GPS
  navigator.geolocation.getCurrentPosition(
    pos => {
      userLat = pos.coords.latitude;
      userLon = pos.coords.longitude;
      info.innerHTML = "Pozíció megvan ";

      // Utána folyamatos frissítés
      navigator.geolocation.watchPosition(p => {
        userLat = p.coords.latitude;
        userLon = p.coords.longitude;
      });
    },
    err => {
      if (err.code === 1) info.innerHTML = "Engedély megtagadva ";
      else if (err.code === 2) info.innerHTML = "Nincs GPS jel ";
      else if (err.code === 3) info.innerHTML = "GPS timeout ";
      else info.innerHTML = "GPS hiba ";
    },
    {
      enableHighAccuracy: true,
      timeout: 20000
    }
  );

  // 🧭 iOS compass FIX
  if (typeof DeviceOrientationEvent.requestPermission === "function") {
    DeviceOrientationEvent.requestPermission()
      .then(res => {
        if (res === "granted") {
          window.addEventListener("deviceorientation", update, true);
          startButton.style.display = "none";
        } else {
          info.innerHTML = "Iránytű tiltva ";
        }
      })
      .catch(() => {
        info.innerHTML = "Iránytű hiba ";
      });
  } else {
    window.addEventListener("deviceorientation", update, true);
    startButton.style.display = "none";
  }
}

// 📐 bearing
function getBearing(lat1, lon1, lat2, lon2) {
  const toRad = d => d * Math.PI / 180;
  const toDeg = r => r * 180 / Math.PI;

  let dLon = toRad(lon2 - lon1);

  let y = Math.sin(dLon) * Math.cos(toRad(lat2));
  let x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
          Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);

  let brng = toDeg(Math.atan2(y, x));
  return (brng + 360) % 360;
}

// 📏 distance
function getDistance(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;

  let dLat = toRad(lat2 - lat1);
  let dLon = toRad(lon2 - lon1);

  let a =
    Math.sin(dLat/2)**2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
    Math.sin(dLon/2)**2;

  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

function update(event) {
  let h;

  if (event.webkitCompassHeading !== undefined) {
    h = event.webkitCompassHeading;
  } else if (event.alpha !== null) {
    h = 360 - event.alpha;
  }

  if (h == null) return;

  heading = h;

  if (userLat && userLon) {
    const bearing = getBearing(userLat, userLon, targetLat, targetLon);
    const distance = getDistance(userLat, userLon, targetLat, targetLon);

    const rotation = bearing - heading;

    needle.style.transform =
      `translateX(-50%) rotate(${rotation}deg)`;

    let dist =
      distance > 1000
        ? (distance / 1000).toFixed(2) + " km"
        : Math.round(distance) + " m";

    info.innerHTML = `Távolság: ${dist}`;
  }
}
</script>

</body>
</html>
