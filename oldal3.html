<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Iránytű</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: #d00000;
      color: white;
      font-family: Futura, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    h1 {
      margin-bottom: 15px;
      letter-spacing: 2px;
    }

    .compass {
      position: relative;
      width: 260px;
      height: 260px;
      border: 3px solid white;
      border-radius: 50%;
    }

    .direction {
      position: absolute;
      font-size: 16px;
      font-weight: bold;
    }

    .north { top: 10px; left: 50%; transform: translateX(-50%); }
    .south { bottom: 10px; left: 50%; transform: translateX(-50%); }
    .east  { right: 10px; top: 50%; transform: translateY(-50%); }
    .west  { left: 10px; top: 50%; transform: translateY(-50%); }

    .needle {
      position: absolute;
      width: 110px;
      height: 110px;
      top: 50%;
      left: 50%;
      transform-origin: 50% 50%;
      transform: translate(-50%, -50%) rotate(0deg);
      transition: transform 0.2s linear;
    }

    .info {
      margin-top: 20px;
      font-size: 16px;
      text-align: center;
      line-height: 1.5;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      background: white;
      color: #d00000;
      border: none;
      font-weight: bold;
      cursor: pointer;
      border-radius: 5px;
    }
  </style>
</head>
<body>

<h1>CÉL IRÁNY</h1>

<div class="compass">
  <div class="direction north">É</div>
  <div class="direction south">D</div>
  <div class="direction east">K</div>
  <div class="direction west">Ny</div>

  <!-- 🔴 EZ A MUTATÓ -->
  <img src="torony.png" class="needle" id="needle">
</div>

<div class="info" id="info">
  Pozíció betöltése...
</div>

<button onclick="startCompass()">Indítás</button>

<script>
const needle = document.getElementById("needle");
const info = document.getElementById("info");

// 🎯 CÉLPONT (koordinátád)
const targetLat = 46.099167;
const targetLon = 18.220306;

let userLat = null;
let userLon = null;
let heading = 0;

function startCompass() {
  // GPS
  navigator.geolocation.watchPosition(pos => {
    userLat = pos.coords.latitude;
    userLon = pos.coords.longitude;
  });

  // iránytű engedély
  if (typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(res => {
        if (res === 'granted') {
          window.addEventListener("deviceorientation", updateCompass);
        } else {
          alert("Engedély szükséges az iránytűhöz!");
        }
      });
  } else {
    window.addEventListener("deviceorientation", updateCompass);
  }
}

// 📐 irány számítás
function getBearing(lat1, lon1, lat2, lon2) {
  const toRad = d => d * Math.PI / 180;
  const toDeg = r => r * 180 / Math.PI;

  let dLon = toRad(lon2 - lon1);

  let y = Math.sin(dLon) * Math.cos(toRad(lat2));
  let x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
          Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLon);

  let brng = toDeg(Math.atan2(y, x));
  return (brng + 360) % 360;
}

// 📏 távolság (méter)
function getDistance(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;

  let dLat = toRad(lat2 - lat1);
  let dLon = toRad(lon2 - lon1);

  let a =
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
    Math.sin(dLon/2) * Math.sin(dLon/2);

  let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

function updateCompass(event) {
  if (event.webkitCompassHeading) {
    heading = event.webkitCompassHeading;
  } else {
    heading = 360 - event.alpha;
  }

  if (userLat && userLon) {
    const bearing = getBearing(userLat, userLon, targetLat, targetLon);
    const distance = getDistance(userLat, userLon, targetLat, targetLon);

    // 🔥 EZ FORGATJA A TORNYOT A CÉL FELÉ
    const rotation = bearing - heading;

    needle.style.transform =
      `translate(-50%, -50%) rotate(${rotation}deg)`;

    let distText =
      distance > 1000
        ? (distance / 1000).toFixed(2) + " km"
        : Math.round(distance) + " m";

    info.innerHTML =
      `Irány: ${Math.round(bearing)}°<br>` +
      `Távolság: ${distText}`;
  }
}
</script>

</body>
</html>
